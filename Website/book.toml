[book]
title = "Haskell: The Craft of Functional Programming"
authors = ["Simon Thompson"]
description = "Online edition of Haskell: The Craft of Functional Programming, 3rd edition"
src = "chapters"
language = "en"

[output.html]
default-theme = "light"
